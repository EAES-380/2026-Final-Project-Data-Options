<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Carbon flux diagram: GPP, ER and NEE</title>
<desc id="d">CO2 moves from the atmosphere into plants by photosynthesis, called GPP, and from plants and soil back to the atmosphere by respiration, called ER or Reco. Net ecosystem exchange NEE equals ER minus GPP. A negative NEE means net uptake of CO2 by the ecosystem.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c2220"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c08a34"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f86"/></marker>
</defs>
<style>
text{fill:#0c2220;font-size:16px;paint-order:stroke;stroke:#fffdf5;stroke-width:4px;stroke-linejoin:round}
.sm{font-size:14px}   .lg{font-size:18px;font-weight:700} .b{font-weight:700} .c{text-anchor:middle} .e{text-anchor:end}
.gold{fill:#c08a34} .lt{fill:#f4eed8}
.note{font-size:13px;font-style:italic;fill:#5b5133}
</style>
<rect width="760" height="420" fill="#fffdf5" stroke="#e3d9b3"/>
<rect x="0" y="0" width="760" height="300" fill="#eaf1ee"/><rect x="0" y="300" width="760" height="120" fill="#e3d9b3"/><rect x="0" y="296" width="760" height="8" fill="#c9b783"/><circle cx="70" cy="60" r="28" fill="#c08a34"/><line x1="108.0" y1="60.0" x2="120.0" y2="60.0" stroke="#c08a34" stroke-width="3"/><line x1="96.8807542283536" y1="86.85935688200391" x2="105.36941345835999" y2="95.3412590552683" stroke="#c08a34" stroke-width="3"/><line x1="70.03026041500786" y1="97.99998795140971" x2="70.03981633553666" y2="109.99998414659173" stroke="#c08a34" stroke-width="3"/><line x1="43.16205749683981" y1="86.90213452864042" x2="34.68691775899974" y2="95.39754543242161" stroke="#c08a34" stroke-width="3"/><line x1="32.0000481943535" y1="60.060520810826496" x2="20.000063413623025" y2="60.07963264582434" stroke="#c08a34" stroke-width="3"/><line x1="43.076502230693634" y1="33.183488894597886" x2="34.57434504038636" y2="24.71511696657616" stroke="#c08a34" stroke-width="3"/><line x1="69.9092188317333" y1="22.000108437266718" x2="69.88055109438592" y2="10.000142680614104" stroke="#c08a34" stroke-width="3"/><line x1="96.79506270232007" y1="33.05515606319576" x2="105.25666145042115" y2="24.546257977889162" stroke="#c08a34" stroke-width="3"/><text x="200" y="40" class="b">Atmosphere: CO₂ in the air</text><path d="M260,300 Q254,265.0 250,230 M260,300 Q260,265.0 262,224 M260,300 Q266,265.0 272,230" fill="none" stroke="#4e7a52" stroke-width="3" stroke-linecap="round"/><path d="M330,300 Q324,265.0 320,230 M330,300 Q330,265.0 332,224 M330,300 Q336,265.0 342,230" fill="none" stroke="#4e7a52" stroke-width="3" stroke-linecap="round"/><path d="M400,300 Q394,265.0 390,230 M400,300 Q400,265.0 402,224 M400,300 Q406,265.0 412,230" fill="none" stroke="#4e7a52" stroke-width="3" stroke-linecap="round"/><path d="M470,300 Q464,265.0 460,230 M470,300 Q470,265.0 472,224 M470,300 Q476,265.0 482,230" fill="none" stroke="#4e7a52" stroke-width="3" stroke-linecap="round"/><path d="M540,300 Q534,265.0 530,230 M540,300 Q540,265.0 542,224 M540,300 Q546,265.0 552,230" fill="none" stroke="#4e7a52" stroke-width="3" stroke-linecap="round"/><text x="400" y="330" class="c b" style="stroke:none;fill:#0c2220">Marsh plants and soil</text><line x1="230" y1="60" x2="230" y2="215" stroke="#0c2220" stroke-width="6" marker-end="url(#arr)"/><text x="30" y="150" class="b">GPP</text><text x="30" y="170" class="sm">photosynthesis pulls CO₂</text><text x="30" y="188" class="sm">out of the air (gross uptake)</text><line x1="580" y1="290" x2="580" y2="75" stroke="#c08a34" stroke-width="6" marker-end="url(#arrg)"/><text x="596" y="130" class="b">ER (Reco)</text><text x="596" y="150" class="sm">respiration by plants and</text><text x="596" y="168" class="sm">microbes releases CO₂</text><rect x="100" y="352" width="560" height="48" rx="10" fill="#0c2220"/><text x="380" y="382" class="c lg" style="stroke:none;fill:#f4eed8;font-size:19px">NEE = ER − GPP   (GPP counted as a positive number)</text><text x="380" y="226" class="c sm" style="display:none"></text><text x="400" y="110" class="sm b c">NEE &lt; 0: net uptake</text><text x="400" y="128" class="sm c">(ecosystem is a CO₂ sink)</text><text x="400" y="152" class="sm b c">NEE &gt; 0: net release</text><text x="400" y="170" class="sm c">(ecosystem is a CO₂ source)</text><text x="640" y="250" class="sm b" style="display:none"></text><text x="380" y="22" class="note c" style="display:none"></text><text x="380" y="418" class="c sm" style="display:none"></text>
</svg>
