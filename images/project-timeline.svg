<desc id="d">A timeline with three milestones: proposal due Wednesday, November 11, 2026, worth 20 points; final presentations Wednesday, December 2, 2026, 3:00 to 5:00 pm, worth 50 points; executive summary due Wednesday, December 9, 2026 at 5:00 pm, worth 30 points.</desc>
