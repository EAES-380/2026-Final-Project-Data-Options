/><text x="306" y="308" class="sm">CO₂</text><circle cx="260" cy="177" r="3" fill="#c08a34"/><circle cx="339" cy="148" r="3" fill="#c08a34"/><circle cx="294" cy="198" r="3" fill="#c08a34"/><circle cx="321" cy="180" r="3" fill="#c08a34"/><circle cx="216" cy="178" r="3" fill="#c08a34"/><circle cx="203" cy="198" r="3" fill="#c08a34"/><circle cx="320" cy="156" r="3" fill="#c08a34"/><circle cx="259" cy="152" r="3" fill="#c08a34"/><circle cx="320" cy="174" r="3" fill="#c08a34"/><circle cx="340" cy="170" r="3" fill="#c08a34"/><circle cx="301" cy="180" r="3" fill="#c08a34"/><circle cx="238" cy="154" r="3" fill="#c08a34"/><circle cx="238" cy="195" r="3" fill="#c08a34"/><circle cx="333" cy="164" r="3" fill="#c08a34"/><circle cx="203" cy="182" r="3" fill="#c08a34"/><circle cx="216" cy="150" r="3" fill="#c08a34"/><circle cx="210" cy="159" r="3" fill="#c08a34"/><circle cx="207" cy="192" r="3" fill="#c08a34"/><text x="270" y="40" class="lg c">Measuring gas flux with a chamber</text><text x="270" y="64" class="sm c">Gas from the soil and plants builds up in the sealed air space</text><rect x="440" y="90" width="290" height="190" rx="8" fill="#fffdf5" stroke="#c9b783"/><line x1="490" y1="250" x2="710" y2="250" stroke="#0c2220" stroke-width="2"/><line x1="490" y1="250" x2="490" y2="120" stroke="#0c2220" stroke-width="2"/><line x1="495" y1="232" x2="700" y2="150" stroke="#c08a34" stroke-width="4"/><circle cx="510" cy="222.0" r="5" fill="#0c2220"/><circle cx="550" cy="214.0" r="5" fill="#0c2220"/><circle cx="590" cy="198.0" r="5" fill="#0c2220"/><circle cx="630" cy="174.0" r="5" fill="#0c2220"/><circle cx="670" cy="166.0" r="5" fill="#0c2220"/><text x="600" y="272" class="c sm">time with chamber closed</text><text x="476" y="190" class="sm" transform="rotate(-90 476 190)" style="text-anchor:middle">gas concentration</text><text x="585" y="112" class="c sm b">The steeper the rise, the bigger the flux</text><text x="585" y="140" class="c sm" style="display:none"></text><text x="585" y="320" class="c sm">Inset is a schematic of the idea, not real data.</text><text x="585" y="344" class="c sm">Positive flux = gas moving from the wetland to the air</text><text x="585" y="362" class="c sm">(the usual convention; confirm in the metadata).</text>
</svg>
