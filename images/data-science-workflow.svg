<rect width="906" height="248" fill="#fffdf5" stroke="#e3d9b3"/>
<rect x="24" y="70" width="128" height="70" rx="12" fill="#0c2220"/><text x="88.0" y="112" class="c lg" style="stroke:none;fill:#f4eed8">Import</text><text x="88.0" y="166" class="c sm">Load the data</text><text x="88.0" y="184" class="c sm">into R</text><text x="88.0" y="60" class="c note">1</text><line x1="154" y1="105" x2="168" y2="105" stroke="#0c2220" stroke-width="3" marker-end="url(#arr)"/><rect x="170" y="70" width="128" height="70" rx="12" fill="#0c2220"/><text x="234.0" y="112" class="c lg" style="stroke:none;fill:#f4eed8">Tidy</text><text x="234.0" y="166" class="c sm">One row</text><text x="234.0" y="184" class="c sm">per observation</text><text x="234.0" y="60" class="c note">2</text><line x1="300" y1="105" x2="314" y2="105" stroke="#0c2220" stroke-width="3" marker-end="url(#arr)"/><rect x="316" y="70" width="128" height="70" rx="12" fill="#c08a34"/><text x="380.0" y="112" class="c lg" style="stroke:none;fill:#0c2220">Transform</text><text x="380.0" y="166" class="c sm">Filter, mutate,</text><text x="380.0" y="184" class="c sm">summarize</text><text x="380.0" y="60" class="c note">3</text><line x1="446" y1="105" x2="460" y2="105" stroke="#0c2220" stroke-width="3" marker-end="url(#arr)"/><rect x="462" y="70" width="128" height="70" rx="12" fill="#c08a34"/><text x="526.0" y="112" class="c lg" style="stroke:none;fill:#0c2220">Visualize</text><text x="526.0" y="166" class="c sm">Plots that</text><text x="526.0" y="184" class="c sm">show patterns</text><text x="526.0" y="60" class="c note">4</text><line x1="592" y1="105" x2="606" y2="105" stroke="#0c2220" stroke-width="3" marker-end="url(#arr)"/><rect x="608" y="70" width="128" height="70" rx="12" fill="#c08a34"/><text x="672.0" y="112" class="c lg" style="stroke:none;fill:#0c2220">Model</text><text x="672.0" y="166" class="c sm">Test</text><text x="672.0" y="184" class="c sm">hypotheses</text><text x="672.0" y="60" class="c note">5</text><line x1="738" y1="105" x2="752" y2="105" stroke="#0c2220" stroke-width="3" marker-end="url(#arr)"/><rect x="754" y="70" width="128" height="70" rx="12" fill="#0c2220"/><text x="818.0" y="112" class="c lg" style="stroke:none;fill:#f4eed8">Communicate</text><text x="818.0" y="166" class="c sm">Tell the</text><text x="818.0" y="184" class="c sm">story</text><text x="818.0" y="60" class="c note">6</text><path d="M316,58 L316,34 L736,34 L736,58" fill="none" stroke="#c08a34" stroke-width="2.5" stroke-dasharray="6 4"/><text x="526.0" y="22" class="c b gold" style="fill:#8a5f14">Explore: go back and forth between these steps</text><text x="24" y="226" class="sm" style="fill:#5b5133">Wrangling = Tidy + Transform. Your whole project is an .Rmd file: code and written narrative together.</text>
