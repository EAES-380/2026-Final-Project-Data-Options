<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Concentration times discharge equals load</title>
<desc id="d">Three cards: concentration, meaning how much dissolved material per volume of water, multiplied by discharge, meaning how much water passes a point per unit time, equals load, the mass of material leaving per unit time. Dividing load by watershed area gives yield.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c2220"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c08a34"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f86"/></marker>
</defs>
<style>
text{fill:#0c2220;font-size:16px;paint-order:stroke;stroke:#fffdf5;stroke-width:4px;stroke-linejoin:round}
.sm{font-size:14px}   .lg{font-size:18px;font-weight:700} .b{font-weight:700} .c{text-anchor:middle} .e{text-anchor:end}
.gold{fill:#c08a34} .lt{fill:#f4eed8}
.note{font-size:13px;font-style:italic;fill:#5b5133}
</style>
<rect width="760" height="364" fill="#fffdf5" stroke="#e3d9b3"/>
<text x="380" y="34" class="lg c">From stream chemistry to export from a watershed</text><rect x="40" y="60" width="190" height="200" rx="12" fill="#f4eed8" stroke="#c9b783"/><path d="M45,90 L45,170 Q45,182 57,182 L113,182 Q125,182 125,170 L125,90" transform="translate(5,0)" fill="#cfe3ea" stroke="#2f6f86" stroke-width="3"/><g fill="#c08a34"><circle cx="60" cy="120" r="4"/><circle cx="77" cy="133" r="4"/><circle cx="94" cy="146" r="4"/><circle cx="111" cy="159" r="4"/><circle cx="68" cy="122" r="4"/><circle cx="85" cy="135" r="4"/><circle cx="102" cy="148" r="4"/><circle cx="119" cy="161" r="4"/></g><text x="135" y="200" class="c b">Concentration</text><text x="135" y="222" class="c sm">how much dissolved</text><text x="135" y="240" class="c sm">stuff per volume of water</text><rect x="285" y="60" width="190" height="200" rx="12" fill="#f4eed8" stroke="#c9b783"/><g transform="translate(260,0)" fill="none" stroke="#2f6f86" stroke-width="5" stroke-linecap="round"><path d="M10,110 Q30,90 50,110 T90,110 T130,110"/><path d="M10,135 Q30,115 50,135 T90,135 T130,135"/><path d="M10,160 Q30,140 50,160 T90,160 T130,160"/></g><text x="380" y="200" class="c b">Discharge</text><text x="380" y="222" class="c sm">how much water passes</text><text x="380" y="240" class="c sm">a point per unit time</text><rect x="530" y="60" width="190" height="200" rx="12" fill="#f4eed8" stroke="#c9b783"/><g transform="translate(500,0)"><rect x="40" y="110" width="80" height="60" rx="6" fill="#c08a34"/><path d="M40,110 L80,88 L120,110" fill="#a8742a"/><text x="80" y="150" class="c b" style="stroke:none;fill:#0c2220;font-size:14px">mass</text></g><text x="625" y="200" class="c b">Load (export)</text><text x="625" y="222" class="c sm">mass of the stuff leaving</text><text x="625" y="240" class="c sm">per unit time</text><text x="262" y="165" class="c lg">×</text><text x="507" y="165" class="c lg">=</text><text x="380" y="296" class="c b">Load ÷ watershed area = yield (mass per area per time)</text><text x="380" y="316" class="c sm">Yield lets you compare big and small watersheds fairly.</text><text x="380" y="344" class="note c">Example units: concentration in mg/L, discharge in L/s, load in mg/s. The exact units depend on the data you download.</text>
</svg>
