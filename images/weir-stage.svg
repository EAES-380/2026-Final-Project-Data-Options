<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Stream gauging weir</title>
<desc id="d">Side view of a small dam called a weir. Water backs up behind it and flows over the crest. A vertical arrow marks stage, the water level above the crest. An inset graph shows discharge rising as stage rises.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c2220"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c08a34"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f86"/></marker>
</defs>
<style>
text{fill:#0c2220;font-size:16px;paint-order:stroke;stroke:#fffdf5;stroke-width:4px;stroke-linejoin:round}
.sm{font-size:14px}   .lg{font-size:18px;font-weight:700} .b{font-weight:700} .c{text-anchor:middle} .e{text-anchor:end}
.gold{fill:#c08a34} .lt{fill:#f4eed8}
.note{font-size:13px;font-style:italic;fill:#5b5133}
</style>
<rect width="760" height="380" fill="#fffdf5" stroke="#e3d9b3"/>
<rect x="0" y="0" width="760" height="380" fill="#fffdf5"/><rect x="0" y="260" width="760" height="120" fill="#d9c98f"/><path d="M0,215 L440,215 L440,240 L760,240 L760,380 L0,380 Z" fill="#d9c98f" style="display:none"/><path d="M20,120 L420,120 L420,262 L20,262 Z" fill="#b9d3d9"/><path d="M420,205 Q470,205 520,238 L520,262 L420,262Z" fill="#b9d3d9"/><rect x="410" y="200" width="22" height="100" fill="#0c2220"/><rect x="405" y="196" width="32" height="8" fill="#c08a34"/><line x1="20" y1="120" x2="420" y2="120" stroke="#2f6f86" stroke-width="3"/><line x1="360" y1="124" x2="360" y2="196" stroke="#0c2220" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="190" y="108" class="b">Water surface in the pool behind the weir</text><text x="352" y="165" class="sm e">stage</text><text x="352" y="182" class="sm e">(water level)</text><text x="440" y="188" class="sm">weir crest:</text><text x="440" y="206" class="sm">water spills over</text><line x1="60" y1="190" x2="140" y2="190" stroke="#2f6f86" stroke-width="4" marker-end="url(#arrb)"/><text x="60" y="176" class="sm">stream flow</text><text x="40" y="326" class="b">A weir is a small dam with a known shape.</text><text x="40" y="346" class="sm">A sensor records stage; a stage-to-discharge relationship converts it to flow.</text><rect x="560" y="30" width="190" height="170" rx="8" fill="#f4eed8" stroke="#c9b783"/><line x1="590" y1="170" x2="725" y2="170" stroke="#0c2220" stroke-width="2"/><line x1="590" y1="170" x2="590" y2="55" stroke="#0c2220" stroke-width="2"/><path d="M590,170 Q660,160 720,62" fill="none" stroke="#c08a34" stroke-width="4"/><text x="657" y="190" class="c sm">stage</text><text x="576" y="112" class="sm" transform="rotate(-90 556 112)" style="text-anchor:middle">discharge</text><text x="655" y="48" class="c sm b">Higher stage = more flow</text><text x="640" y="218" class="c note" style="display:none"></text><text x="380" y="368" class="note c">Schematic. Real stations may also use pipes or other structures; see the dataset metadata.</text>
</svg>
