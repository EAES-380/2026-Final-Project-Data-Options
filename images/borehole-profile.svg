<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Borehole temperature profile schematic</title>
<desc id="d">Left: a ground column with a thin active layer on top and permafrost below, with a deep borehole holding temperature sensors at several depths. Right: a schematic graph of temperature against depth. A summer curve and a winter curve are far apart near the surface and converge with depth, showing that seasonal swings fade with depth. A dashed line marks 0 degrees Celsius.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c2220"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c08a34"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f86"/></marker>
</defs>
<style>
text{fill:#0c2220;font-size:16px;paint-order:stroke;stroke:#fffdf5;stroke-width:4px;stroke-linejoin:round}
.sm{font-size:14px}   .lg{font-size:18px;font-weight:700} .b{font-weight:700} .c{text-anchor:middle} .e{text-anchor:end}
.gold{fill:#c08a34} .lt{fill:#f4eed8}
.note{font-size:13px;font-style:italic;fill:#5b5133}
</style>
<rect width="760" height="490" fill="#fffdf5" stroke="#e3d9b3"/>
<text x="380" y="30" class="lg c">A borehole temperature profile in permafrost</text><rect x="40" y="60" width="200" height="40" fill="#e3d9b3"/><rect x="40" y="100" width="200" height="330" fill="#b9d3d9"/><text x="196" y="86" class="c sm b">Active layer</text><text x="196" y="270" class="c sm b">Permafrost</text><text x="196" y="288" class="c sm">(ground at or</text><text x="196" y="304" class="c sm">below 0 °C)</text><line x1="140" y1="40" x2="140" y2="420" stroke="#0c2220" stroke-width="5" style="display:none"/><rect x="133" y="62" width="14" height="360" rx="3" fill="#fffdf5" stroke="#0c2220" stroke-width="2"/><circle cx="140" cy="75" r="6" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="140" cy="110" r="6" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="140" cy="160" r="6" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="140" cy="215" r="6" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="140" cy="320" r="6" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="140" cy="415" r="6" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><text x="140" y="52" class="c sm">ground surface</text><text x="260" y="170" class="sm">temperature sensors at</text><text x="260" y="188" class="sm">several depths in a</text><text x="260" y="206" class="sm">deep borehole (40–75 m)</text><line x1="256" y1="160" x2="150" y2="162" stroke="#0c2220" stroke-width="1.5"/><line x1="76" y1="64" x2="76" y2="424" stroke="#0c2220" stroke-width="2" marker-end="url(#arr)"/><text x="30" y="250" class="sm" transform="rotate(-90 30 250)" style="text-anchor:middle">depth (down)</text><line x1="470" y1="70" x2="470" y2="380" stroke="#0c2220" stroke-width="2"/><line x1="470" y1="70" x2="730" y2="70" stroke="#0c2220" stroke-width="2"/><text x="600.0" y="58" class="c sm b">temperature →</text><line x1="620" y1="70" x2="620" y2="380" stroke="#2f6f86" stroke-width="2" stroke-dasharray="6 4"/><text x="626" y="396" class="sm" style="fill:#2f6f86">0 °C</text><path d="M690,74 C630,140 568,190 568,290 L568,380" fill="none" stroke="#c08a34" stroke-width="4"/><path d="M510,74 C540,140 568,190 568,290 L568,380" fill="none" stroke="#2f6f86" stroke-width="4"/><text x="734" y="100" class="sm b" style="fill:#8a5f14;display:none"></text><text x="700" y="98" class="sm b" style="fill:#8a5f14">summer</text><text x="478" y="98" class="sm b" style="fill:#2f6f86">winter</text><text x="600.0" y="426" class="sm c">The yearly swing shrinks with depth;</text><text x="600.0" y="444" class="sm c">deep down the temperature stays steady.</text><text x="380" y="476" class="note c">Schematic of the general shape only. Not real data. Depths, temperatures and the shape differ by site; see the dataset metadata.</text>
</svg>
