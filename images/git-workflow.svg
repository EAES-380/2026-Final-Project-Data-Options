<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 200" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Git and GitHub workflow for a group project</title>
<desc id="d">Six steps in a row: fork the repo, edit, commit, push, open a pull request, merge.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c2220"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c08a34"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f86"/></marker>
</defs>
<style>
text{fill:#0c2220;font-size:16px;paint-order:stroke;stroke:#fffdf5;stroke-width:4px;stroke-linejoin:round}
.sm{font-size:14px}   .lg{font-size:18px;font-weight:700} .b{font-weight:700} .c{text-anchor:middle} .e{text-anchor:end}
.gold{fill:#c08a34} .lt{fill:#f4eed8}
.note{font-size:13px;font-style:italic;fill:#5b5133}
</style>
<rect width="848" height="200" fill="#fffdf5" stroke="#e3d9b3"/>
<rect x="20" y="50" width="118" height="52" rx="10" fill="#0c2220"/><text x="79.0" y="82" class="c b" style="stroke:none;fill:#f4eed8">Fork</text><text x="79.0" y="30" class="c note">step 1</text><text x="79.0" y="128" class="c sm">Make your own</text><text x="79.0" y="145" class="c sm">copy of the group</text><text x="79.0" y="162" class="c sm">repo on GitHub</text><line x1="140" y1="76" x2="156" y2="76" stroke="#0c2220" stroke-width="3" marker-end="url(#arr)"/><rect x="158" y="50" width="118" height="52" rx="10" fill="#c08a34"/><text x="217.0" y="82" class="c b" style="stroke:none;fill:#0c2220">Edit</text><text x="217.0" y="30" class="c note">step 2</text><text x="217.0" y="128" class="c sm">Add to your</text><text x="217.0" y="145" class="c sm">proposal in</text><text x="217.0" y="162" class="c sm">RStudio</text><line x1="278" y1="76" x2="294" y2="76" stroke="#0c2220" stroke-width="3" marker-end="url(#arr)"/><rect x="296" y="50" width="118" height="52" rx="10" fill="#0c2220"/><text x="355.0" y="82" class="c b" style="stroke:none;fill:#f4eed8">Commit</text><text x="355.0" y="30" class="c note">step 3</text><text x="355.0" y="128" class="c sm">Save a snapshot</text><text x="355.0" y="145" class="c sm">with a short</text><text x="355.0" y="162" class="c sm">message</text><line x1="416" y1="76" x2="432" y2="76" stroke="#0c2220" stroke-width="3" marker-end="url(#arr)"/><rect x="434" y="50" width="118" height="52" rx="10" fill="#c08a34"/><text x="493.0" y="82" class="c b" style="stroke:none;fill:#0c2220">Push</text><text x="493.0" y="30" class="c note">step 4</text><text x="493.0" y="128" class="c sm">Send your commits</text><text x="493.0" y="145" class="c sm">up to GitHub</text><line x1="554" y1="76" x2="570" y2="76" stroke="#0c2220" stroke-width="3" marker-end="url(#arr)"/><rect x="572" y="50" width="118" height="52" rx="10" fill="#0c2220"/><text x="631.0" y="82" class="c b" style="stroke:none;fill:#f4eed8">Pull request</text><text x="631.0" y="30" class="c note">step 5</text><text x="631.0" y="128" class="c sm">Ask teammates to</text><text x="631.0" y="145" class="c sm">review and merge</text><line x1="692" y1="76" x2="708" y2="76" stroke="#0c2220" stroke-width="3" marker-end="url(#arr)"/><rect x="710" y="50" width="118" height="52" rx="10" fill="#c08a34"/><text x="769.0" y="82" class="c b" style="stroke:none;fill:#0c2220">Merge</text><text x="769.0" y="30" class="c note">step 6</text><text x="769.0" y="128" class="c sm">Your work joins</text><text x="769.0" y="145" class="c sm">the shared repo</text>
</svg>
