<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Seismic reflection and vibracore cartoon</title>
<desc id="d">A boat at the water surface sends sound pulses down through water and sediment. Echoes bounce back from boundaries between layers, including the boundary between younger Holocene sediments and older Pleistocene sediments, and are recorded by a receiver. A vibracore tube on the right samples the sediment layers directly.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c2220"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c08a34"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f86"/></marker>
</defs>
<style>
text{fill:#0c2220;font-size:16px;paint-order:stroke;stroke:#fffdf5;stroke-width:4px;stroke-linejoin:round}
.sm{font-size:14px}   .lg{font-size:18px;font-weight:700} .b{font-weight:700} .c{text-anchor:middle} .e{text-anchor:end}
.gold{fill:#c08a34} .lt{fill:#f4eed8}
.note{font-size:13px;font-style:italic;fill:#5b5133}
</style>
<rect width="760" height="470" fill="#fffdf5" stroke="#e3d9b3"/>
<rect x="0" y="0" width="760" height="470" fill="#fffdf5"/><rect x="0" y="80" width="760" height="110" fill="#b9d3d9"/><rect x="0" y="190" width="760" height="110" fill="#e3d9b3"/><rect x="0" y="300" width="760" height="130" fill="#c4a56d"/><path d="M0,190 L760,190" stroke="#8a5f14" stroke-width="2"/><path d="M0,300 Q200,288 400,302 T760,298" stroke="#0c2220" stroke-width="3" stroke-dasharray="8 5" fill="none"/><text x="20" y="110" class="b">Water</text><text x="20" y="230" class="b">Younger sediments</text><text x="20" y="248" class="sm">(Holocene)</text><text x="20" y="350" class="b">Older sediments</text><text x="20" y="368" class="sm">(Pleistocene)</text><path d="M120,66 L220,66 L205,86 L135,86 Z" fill="#0c2220"/><rect x="160" y="42" width="6" height="24" fill="#0c2220"/><path d="M166,44 L196,60 L166,60 Z" fill="#c08a34"/><line x1="160" y1="86" x2="160" y2="96" stroke="#0c2220" stroke-width="3"/><line x1="165" y1="96" x2="270" y2="190" stroke="#2f6f86" stroke-width="3" marker-end="url(#arrb)"/><line x1="270" y1="190" x2="372" y2="96" stroke="#2f6f86" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrb)"/><line x1="270" y1="190" x2="378" y2="300" stroke="#2f6f86" stroke-width="3" marker-end="url(#arrb)" style="display:none"/><line x1="170" y1="96" x2="320" y2="300" stroke="#c08a34" stroke-width="3" marker-end="url(#arrg)"/><line x1="320" y1="300" x2="470" y2="96" stroke="#c08a34" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrg)"/><rect x="372" y="64" width="150" height="40" rx="8" fill="#0c2220"/><text x="447" y="80" class="c sm" style="stroke:none;fill:#f4eed8">receiver records</text><text x="447" y="96" class="c sm" style="stroke:none;fill:#f4eed8">the echoes</text><text x="40" y="30" class="lg">Seismic reflection and core samples</text><rect x="690" y="60" width="26" height="320" rx="4" fill="#fffdf5" stroke="#0c2220" stroke-width="3"/><rect x="694" y="190" width="18" height="110" fill="#e3d9b3"/><rect x="694" y="300" width="18" height="78" fill="#c4a56d"/><text x="703" y="50" class="c sm b">Vibracore</text><text x="716" y="404" class="e sm">a tube vibrated into the sediment</text><text x="716" y="422" class="e sm">brings up a core to check the layers</text><text x="300" y="150" class="sm b" style="fill:#8a5f14" transform="rotate(0)">sound pulse down, echo back up</text><text x="420" y="226" class="sm">echoes return from boundaries</text><text x="420" y="244" class="sm">between layers</text><text x="440" y="334" class="sm b">Boundary between younger</text><text x="440" y="352" class="sm b">and older sediments</text><text x="380" y="458" class="note c">Schematic only. Real surveys show many layers and the exact method is described in the associated publications.</text>
</svg>
