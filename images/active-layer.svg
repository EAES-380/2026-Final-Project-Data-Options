<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Active layer and paired burned and unburned sites</title>
<desc id="d">Two soil cross-sections side by side, an unburned forest site with green trees and a burned site with charred trunks. Each shows an organic layer, mineral soil, a dashed line marking the permafrost table, and permafrost below. Temperature sensors sit at several depths in each column. A bracket marks the active layer that thaws in summer.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c2220"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c08a34"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f86"/></marker>
</defs>
<style>
text{fill:#0c2220;font-size:16px;paint-order:stroke;stroke:#fffdf5;stroke-width:4px;stroke-linejoin:round}
.sm{font-size:14px}   .lg{font-size:18px;font-weight:700} .b{font-weight:700} .c{text-anchor:middle} .e{text-anchor:end}
.gold{fill:#c08a34} .lt{fill:#f4eed8}
.note{font-size:13px;font-style:italic;fill:#5b5133}
</style>
<rect width="760" height="490" fill="#fffdf5" stroke="#e3d9b3"/>
<text x="380" y="30" class="lg c">Soil temperature sensors at paired sites</text><rect x="60" y="140" width="250" height="40" fill="#8b6b3d"/><rect x="60" y="180" width="250" height="100" fill="#b08a52"/><rect x="60" y="280" width="250" height="150" fill="#a8c4cc"/><rect x="60" y="132" width="250" height="8" fill="#5b4a2b"/><line x1="60" y1="280" x2="310" y2="280" stroke="#2f6f86" stroke-width="3" stroke-dasharray="7 4"/><rect x="107" y="100" width="6" height="34" fill="#5b4a2b"/><path d="M110,72 L90,112 L130,112 Z" fill="#4e7a52"/><rect x="182" y="100" width="6" height="34" fill="#5b4a2b"/><path d="M185,72 L165,112 L205,112 Z" fill="#4e7a52"/><rect x="257" y="100" width="6" height="34" fill="#5b4a2b"/><path d="M260,72 L240,112 L280,112 Z" fill="#4e7a52"/><circle cx="185" cy="143" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="185" cy="200" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="185" cy="250" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="185" cy="300" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="185" cy="360" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="185" cy="422" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><rect x="450" y="140" width="250" height="40" fill="#8b6b3d"/><rect x="450" y="180" width="250" height="100" fill="#b08a52"/><rect x="450" y="280" width="250" height="150" fill="#a8c4cc"/><rect x="450" y="132" width="250" height="8" fill="#5b4a2b"/><line x1="450" y1="280" x2="700" y2="280" stroke="#2f6f86" stroke-width="3" stroke-dasharray="7 4"/><rect x="497" y="72" width="6" height="62" fill="#2a2a2a"/><line x1="500" y1="90" x2="514" y2="80" stroke="#2a2a2a" stroke-width="3"/><line x1="500" y1="106" x2="486" y2="97" stroke="#2a2a2a" stroke-width="3"/><rect x="572" y="72" width="6" height="62" fill="#2a2a2a"/><line x1="575" y1="90" x2="589" y2="80" stroke="#2a2a2a" stroke-width="3"/><line x1="575" y1="106" x2="561" y2="97" stroke="#2a2a2a" stroke-width="3"/><rect x="647" y="72" width="6" height="62" fill="#2a2a2a"/><line x1="650" y1="90" x2="664" y2="80" stroke="#2a2a2a" stroke-width="3"/><line x1="650" y1="106" x2="636" y2="97" stroke="#2a2a2a" stroke-width="3"/><circle cx="575" cy="143" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="575" cy="200" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="575" cy="250" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="575" cy="300" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="575" cy="360" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><circle cx="575" cy="422" r="5" fill="#c08a34" stroke="#0c2220" stroke-width="1.5"/><text x="185" y="116" class="c b" style="display:none"></text><text x="185" y="50" class="c b" style="display:none"></text><text x="185" y="448" class="c b">Unburned site</text><text x="575" y="448" class="c b">Burned site</text><text x="380" y="52" class="c sm">Same kind of sensors, same range of depths, at both sites</text><text x="320" y="165" class="sm e" style="display:none"></text><text x="312" y="160" class="sm">organic layer</text><text x="312" y="226" class="sm">mineral soil</text><text x="312" y="298" class="sm" style="fill:#2f6f86">permafrost table</text><text x="312" y="314" class="sm" style="fill:#2f6f86">(top of permafrost;</text><text x="312" y="330" class="sm" style="fill:#2f6f86">depth varies)</text><text x="312" y="364" class="sm b">permafrost below</text><text x="312" y="200" class="sm" style="display:none"></text><path d="M52,140 L44,140 L44,280 L52,280" fill="none" stroke="#0c2220" stroke-width="2"/><text x="36" y="215" class="sm c" transform="rotate(-90 36 215)">active layer: thaws in summer</text><text x="380" y="476" class="note c">Sensors shown at the top (about 5 cm) and bottom (about 150 cm) of the range, plus a few between. Schematic only.</text>
</svg>
