<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Watershed water budget</title>
<desc id="d">Cross-section of a watershed between two ridgelines. Precipitation falls from a cloud. Water leaves as streamflow at the outlet and as evapotranspiration from plants and soil, or is stored in soil, groundwater and snow. The water budget is P equals Q plus ET plus change in storage.</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c2220"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c08a34"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f86"/></marker>
</defs>
<style>
text{fill:#0c2220;font-size:16px;paint-order:stroke;stroke:#fffdf5;stroke-width:4px;stroke-linejoin:round}
.sm{font-size:14px}   .lg{font-size:18px;font-weight:700} .b{font-weight:700} .c{text-anchor:middle} .e{text-anchor:end}
.gold{fill:#c08a34} .lt{fill:#f4eed8}
.note{font-size:13px;font-style:italic;fill:#5b5133}
</style>
<rect width="760" height="500" fill="#fffdf5" stroke="#e3d9b3"/>
<rect x="0" y="0" width="760" height="500" fill="#eaf1ee"/><path d="M0,180 Q70,150 150,175 Q260,330 380,330 Q500,330 610,175 Q690,150 760,180 L760,500 L0,500 Z" fill="#d9c98f"/><path d="M150,175 Q260,330 380,330 Q500,330 610,175" fill="none" stroke="#c08a34" stroke-width="3" stroke-dasharray="8 5"/><path d="M170,268 Q200,300 250,330 Q320,360 380,362 Q460,360 520,330 Q560,300 590,268 L590,470 L170,470 Z" fill="#b9d3d9" opacity=".6"/><text x="380" y="418" class="c sm b">Soil and groundwater: stored water</text><path d="M300,330 Q380,340 460,330" stroke="#2f6f86" stroke-width="7" fill="none" stroke-linecap="round"/><line x1="420" y1="331" x2="520" y2="345" stroke="#2f6f86" stroke-width="7" stroke-linecap="round"/><rect x="227" y="255" width="6" height="16" fill="#5b4a2b"/><circle cx="230" cy="247" r="16" fill="#4e7a52"/><rect x="267" y="290" width="6" height="16" fill="#5b4a2b"/><circle cx="270" cy="282" r="16" fill="#4e7a52"/><rect x="497" y="290" width="6" height="16" fill="#5b4a2b"/><circle cx="500" cy="282" r="16" fill="#4e7a52"/><rect x="537" y="255" width="6" height="16" fill="#5b4a2b"/><circle cx="540" cy="247" r="16" fill="#4e7a52"/><rect x="327" y="318" width="6" height="16" fill="#5b4a2b"/><circle cx="330" cy="310" r="16" fill="#4e7a52"/><rect x="427" y="318" width="6" height="16" fill="#5b4a2b"/><circle cx="430" cy="310" r="16" fill="#4e7a52"/><g fill="#fff" stroke="#8aa5a0" stroke-width="2"><ellipse cx="230" cy="70" rx="55" ry="26"/><ellipse cx="275" cy="62" rx="40" ry="24"/><ellipse cx="190" cy="76" rx="36" ry="20"/></g><line x1="190" y1="105" x2="184" y2="145" stroke="#2f6f86" stroke-width="3" marker-end="url(#arrb)"/><line x1="215" y1="105" x2="209" y2="145" stroke="#2f6f86" stroke-width="3" marker-end="url(#arrb)"/><line x1="240" y1="105" x2="234" y2="145" stroke="#2f6f86" stroke-width="3" marker-end="url(#arrb)"/><line x1="265" y1="105" x2="259" y2="145" stroke="#2f6f86" stroke-width="3" marker-end="url(#arrb)"/><line x1="290" y1="105" x2="284" y2="145" stroke="#2f6f86" stroke-width="3" marker-end="url(#arrb)"/><text x="70" y="30" class="b">P = precipitation</text><text x="70" y="48" class="sm">rain and snow falling on the watershed</text><path d="M400,255 q-10,-25 0,-50 q10,-25 0,-50" fill="none" stroke="#c08a34" stroke-width="3.5" marker-end="url(#arrg)"/><path d="M450,255 q-10,-25 0,-50 q10,-25 0,-50" fill="none" stroke="#c08a34" stroke-width="3.5" marker-end="url(#arrg)"/><path d="M500,255 q-10,-25 0,-50 q10,-25 0,-50" fill="none" stroke="#c08a34" stroke-width="3.5" marker-end="url(#arrg)"/><text x="470" y="50" class="b">ET = evapotranspiration</text><text x="470" y="68" class="sm">water returned to the air by evaporation</text><text x="470" y="86" class="sm">from surfaces + transpiration by plants</text><line x1="400" y1="340" x2="560" y2="400" stroke="#0c2220" stroke-width="4" marker-end="url(#arr)" style="display:none"/><line x1="520" y1="346" x2="595" y2="376" stroke="#0c2220" stroke-width="5" marker-end="url(#arr)"/><text x="604" y="384" class="b">Q = streamflow</text><text x="604" y="402" class="sm">(discharge) leaving</text><text x="604" y="420" class="sm">at the outlet</text><text x="40" y="262" class="b">ΔS = change in storage</text><text x="40" y="280" class="sm">soil water, groundwater, snow</text><text x="380" y="488" class="sm c" style="fill:#8a5f14">Dashed gold line = watershed boundary (the ridgeline). Water inside it drains to the stream outlet.</text><rect x="190" y="436" width="380" height="26" rx="8" fill="#0c2220"/><text x="380" y="455" class="c b" style="stroke:none;fill:#f4eed8;font-size:17px">Water budget:  P = Q + ET + ΔS</text>
</svg>
